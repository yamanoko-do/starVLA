run_id: starvla_foldclothes
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: QwenZone_test
is_debug: false
version_id: "0.21"

framework:
  name: QwenZone
  qwenvl:
    base_vlm: /mnt/workspace/yama/oss_yama/cache/hf_cache/hub/hub/models--Qwen--Qwen3.5-0.8B/snapshots/2fc06364715b967f1860aea9cf38778875588b17
    attn_implementation: sdpa
    vl_hidden_dim: 1024
  action_model:
    action_dim: 14
    action_horizon: 8
    action_hidden_dim: 1024      # must match VLM hidden_size
    state_history_len: 50
    num_cmd_tokens: 4
    num_state_tokens: 8
    nhead: 8
    num_transformer_layers: 4
    hidden_size: 512

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /mnt/workspace/yama/oss_yama/fold_clothes
    data_mix: fold_clothes
    data_cfg:
      cameras: ["cam_high"]
      max_video_frames: 8       # ← VLM的图像观测历史 (默认 8)
      state_history_len: 50     # ← 动作头能看到的历史动作 (默认 50)
      include_state: True
      video_backend: torchvision_av
    per_device_batch_size: 4
    load_all_data_for_training: true

trainer:
  max_train_steps: 80000
  num_warmup_steps: 5000
  save_interval: 5000  #保存检查点
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: 'qwen_vl_interface'
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 50       # 上报频率
  gradient_clipping: 1.0      # 
  gradient_accumulation_steps: 4
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
