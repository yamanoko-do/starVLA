# QwenZone Phase 2 training config — dual-Pass (parallel + RNN) + async delay δ
# Implements the full tt.md design: Pass2 RNN forward + async δ + RNN inference (mode-2).
#
# Usage:
#   bash examples/Robotwin/train_files/run_qwenzone_train_phase2.sh
#   NUM_GPUS=2 MAX_STEPS=50000 bash examples/Robotwin/train_files/run_qwenzone_train_phase2.sh
run_id: qwenzone_click_bell_20260630
run_root_dir: results/Checkpoints_QwenZone
seed: 42
wandb_entity: qwenzone
wandb_project: qwenzone
is_debug: false
version_id: "0.2"

framework:
  name: QwenZone
  qwenvl:
    base_vlm: /mnt/workspace/yama/starVLA/playground/Pretrained_models/Qwen3-VL-4B-Instruct-MemoryAction
    attn_implementation: sdpa                     # 4D additive mask requires sdpa

  qwenzone:
    train_seq_len: 8                                       # sequence time steps (increased from 4 to 8)
    N_act: 16                                      # cmd (action-intent) tokens per step
    N_mem: 4                                       # memory tokens per step
    max_history: 16                                # inference history cap (mode-1)
    # ── Phase 2 ──
    lambda_rnn: 1.0                                # Pass2 (RNN) loss weight; raised to 1.0 for stronger RNN training
    d_max: 8                                       # async action delay: δ ~ U{t-d_max, ..., t}; increased to 8
    infer_mode: full                               # post-train eval both modes; default full
    stereo:
      ckpt_path: /mnt/workspace/yama/OpenStereo/output/MultiDataset/WAVEStereo/wavestereo_mixdataset/20260623_wavestereo_filter/ckpt/checkpoint_epoch_2.pth
      update_iters: 4                              # N iterations of update_block
      N_stereo_tokens: 64                          # stereo tokens (cat + ResConv×2 + adaptive pool)
      input_size: [224, 224]                       # stereo image resize (224×224, no padding needed, matches VLM)

  action_model:
    action_model_type: ZoneMemory
    action_dim: 14
    state_dim: 28                                   # endpose(14) + joint(12) + gripper(2)
    action_horizon: 50
    action_hidden_dim: 2560                        # overwritten by VLM hidden_size
    hidden_size: 512
    N_state_tokens: 4
    nhead: 8
    num_transformer_layers: 4
    # token随机遮蔽参数 (训练时正则化，推理时关闭)
    vis_mask_probability: 0.5                      # 每个训练step有50%概率应用视觉遮蔽
    vis_mask_ratio: 1                               # 视觉遮蔽比例上限，实际在[0, vis_mask_ratio]间随机选择
    cmd_mask_probability: 0.5                       # 每个训练step有50%概率应用cmd遮蔽
    cmd_mask_ratio: 1                               # cmd遮蔽比例上限，实际在[0, cmd_mask_ratio]间随机选择
    # N_act / N_stereo / stereo_dim are read from qwenzone.* (single source of truth)
    # vis is NOT pooled: raw VLM vision tokens (N_v per step) fed directly to the head

datasets:
  vla_data:
    dataset_py: robotwin_hdf5                         # HDF5 dataloader (bypasses LeRobot)
    include_state: true
    data_root_dir: /mnt/workspace/yama/RoboTwin/data
    data_mix: click_bell                             # sub-directory name
    train_seq_len: 8                                        # sequence time steps (increased from 4 to 8)
    per_device_batch_size: 1                        # dual-Pass + stereo → keep small
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    video_backend: torchvision_av
    shuffle: true

trainer:
  max_train_steps: 50000
  num_warmup_steps: 2000
  save_interval: 5000
  eval_interval: 99999999                              # chunk model: disable trainer MSE eval; use sim eval instead
  learning_rate:
    base: 2.0e-05
    qwen_vl_interface: 1.0e-05                     # VLM backbone: conservative lr
    action_model: 1.0e-04                          # randomly-init action head: higher lr
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-07
  freeze_modules: ''
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
